<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classy - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
        <h1 id="welcomeText" class="text-2xl font-bold text-blue-900 mb-4">أهلاً بك</h1>
        <p class="text-gray-600">تم تسجيل دخولك بنجاح إلى منصة Classy التعليمية.</p>
        <button onclick="localStorage.clear(); window.location.href='index.html';" class="mt-6 bg-red-600 text-white px-4 py-2 rounded-xl">تسجيل الخروج</button>
    </div>
    <script>
        const userName = localStorage.getItem('name') || 'مستخدم';
        document.getElementById('welcomeText').textContent = `أهلاً بك يا ${userName}`;
    </script>
</body>
</html>
