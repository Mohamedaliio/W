<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classy - لوحة التحكم الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center mb-6">
            <div>
                <h1 id="welcomeText" class="text-xl md:text-2xl font-bold text-blue-900">أهلاً بك</h1>
                <p class="text-gray-500 text-sm">منظومة Classy لإدارة الدروس الخصوصية</p>
            </div>
            <button onclick="logout()" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-sm font-bold hover:bg-red-100 transition">تسجيل الخروج</button>
        </div>

        <!-- Grid Options -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <a href="attendance.html" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition flex items-center space-x-4 space-x-reverse">
                <div class="bg-orange-100 p-4 rounded-xl text-orange-600 text-2xl">📋</div>
                <div>
                    <h2 class="text-lg font-bold text-gray-800">تسجيل الحضور</h2>
                    <p class="text-gray-500 text-sm">متابعة حضور الطلاب وغيابهم للحصص</p>
                </div>
            </a>

            <a href="grades.html" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition flex items-center space-x-4 space-x-reverse">
                <div class="bg-green-100 p-4 rounded-xl text-green-600 text-2xl">📊</div>
                <div>
                    <h2 class="text-lg font-bold text-gray-800">إدارة الدرجات</h2>
                    <p class="text-gray-500 text-sm">رصد درجات الاختبارات والتقييمات الشهرية</p>
                </div>
            </a>
        </div>
    </div>
    <script>
        const userName = localStorage.getItem('name') || 'أستاذنا الفاضل';
        document.getElementById('welcomeText').textContent = `أهلاً بك، ${userName}`;
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
