<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classy - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md mx-4 border border-gray-100">
        <h1 class="text-3xl font-bold text-blue-900 text-center mb-2">Classy</h1>
        <p class="text-gray-500 text-center mb-6 text-sm">تسجيل الدخول إلى المنظومة</p>
        
        <form id="loginForm" class="space-y-4">
            <input type="email" id="email" required placeholder="البريد الإلكتروني" class="w-full px-4 py-3 border rounded-xl text-right">
            <input type="password" id="password" required placeholder="كلمة المرور" class="w-full px-4 py-3 border rounded-xl text-right">
            <button type="submit" class="w-full bg-blue-900 text-white py-3 rounded-xl font-bold">دخول</button>
        </form>
        <div id="msg" class="mt-4 text-center text-sm font-semibold"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
