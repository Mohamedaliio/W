<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classy - التقارير والإحصائيات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-blue-900">تقارير وإحصائيات المنظومة</h1>
            <a href="dashboard.html" class="text-blue-600 text-sm font-semibold hover:underline">← العودة للوحة التحكم</a>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-blue-50 p-4 rounded-2xl text-center border border-blue-100">
                <span class="block text-2xl font-bold text-blue-900">45</span>
                <span class="text-sm text-gray-600">إجمالي الطلاب المسجلين</span>
            </div>
            <div class="bg-green-50 p-4 rounded-2xl text-center border border-green-100">
                <span class="block text-2xl font-bold text-green-900">92%</span>
                <span class="text-sm text-gray-600">نسبة الحضور العامة</span>
            </div>
        </div>

        <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 text-center text-gray-600 text-sm">
            التقارير تتحدث تلقائياً مع كل عملية تسجيل حضور أو رصد درجات جديدة.
        </div>
    </div>
</body>
</html>
