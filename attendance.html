<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classy - تسجيل الحضور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-blue-900">تسجيل الحضور والغياب</h1>
            <a href="dashboard.html" class="text-blue-600 text-sm font-semibold hover:underline">← العودة للوحة التحكم</a>
        </div>

        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">اختر المجموعة / الصف</label>
                <select id="groupSelect" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-900 text-right">
                    <option value="first_sec">الصف الأول الثانوي</option>
                    <option value="second_sec">الصف الثاني الثانوي</option>
                    <option value="third_sec">الصف الثالث الثانوي</option>
                </select>
            </div>
        </div>

        <div id="studentsList" class="space-y-3 mb-6">
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
                <span class="font-semibold text-gray-800">أحمد محمد علي</span>
                <div class="flex space-x-2 space-x-reverse">
                    <button onclick="toggleStatus(this)" class="px-4 py-1.5 bg-green-100 text-green-700 rounded-lg text-sm font-bold status-btn">حاضر</button>
                </div>
            </div>
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
                <span class="font-semibold text-gray-800">محمود إبراهيم</span>
                <div class="flex space-x-2 space-x-reverse">
                    <button onclick="toggleStatus(this)" class="px-4 py-1.5 bg-green-100 text-green-700 rounded-lg text-sm font-bold status-btn">حاضر</button>
                </div>
            </div>
        </div>

        <button onclick="saveAttendance()" class="w-full bg-blue-900 text-white py-3.5 rounded-xl font-bold hover:bg-blue-800 transition shadow-lg shadow-blue-900/20">حفظ الحضور</button>
        <div id="msg" class="mt-4 text-center text-sm font-semibold"></div>
    </div>

    <script>
        function toggleStatus(btn) {
            if (btn.textContent === 'حاضر') {
                btn.textContent = 'غائب';
                btn.className = 'px-4 py-1.5 bg-red-100 text-red-700 rounded-lg text-sm font-bold status-btn';
            } else {
                btn.textContent = 'حاضر';
                btn.className = 'px-4 py-1.5 bg-green-100 text-green-700 rounded-lg text-sm font-bold status-btn';
            }
        }

        function saveAttendance() {
            const msg = document.getElementById('msg');
            msg.textContent = "تم حفظ الحضور بنجاح!";
            msg.className = "mt-4 text-center text-sm text-green-600 font-bold bg-green-50 p-3 rounded-xl";
        }
    </script>
</body>
</html>
