<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classy - إدارة الدرجات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-blue-900">رصد درجات الاختبارات</h1>
            <a href="dashboard.html" class="text-blue-600 text-sm font-semibold hover:underline">← العودة للوحة التحكم</a>
        </div>

        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">اسم الاختبار / الواجب</label>
                <input type="text" id="examName" placeholder="مثال: امتحان الهندسة الشهري" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-900 text-right">
            </div>
        </div>

        <div class="space-y-3 mb-6">
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
                <span class="font-semibold text-gray-800">أحمد محمد علي</span>
                <input type="number" placeholder="الدرجة" class="w-24 px-3 py-2 border rounded-xl text-center font-bold">
            </div>
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
                <span class="font-semibold text-gray-800">محمود إبراهيم</span>
                <input type="number" placeholder="الدرجة" class="w-24 px-3 py-2 border rounded-xl text-center font-bold">
            </div>
        </div>

        <button onclick="saveGrades()" class="w-full bg-blue-900 text-white py-3.5 rounded-xl font-bold hover:bg-blue-800 transition shadow-lg shadow-blue-900/20">حفظ الدرجات</button>
        <div id="msg" class="mt-4 text-center text-sm font-semibold"></div>
    </div>

    <script>
        function saveGrades() {
            const msg = document.getElementById('msg');
            msg.textContent = "تم حفظ الدرجات بنجاح!";
            msg.className = "mt-4 text-center text-sm text-green-600 font-bold bg-green-50 p-3 rounded-xl";
        }
    </script>
</body>
      </html>
