<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classy - إدارة المجموعات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-blue-900">إدارة المجموعات الدراسية</h1>
            <a href="dashboard.html" class="text-blue-600 text-sm font-semibold hover:underline">← العودة للوحة التحكم</a>
        </div>

        <div class="space-y-4 mb-6">
            <input type="text" id="groupName" placeholder="اسم المجموعة الجديدة (مثال: مجموعات الصف الأول الثانوي)" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-900 text-right">
            <button onclick="addGroup()" class="w-full bg-blue-900 text-white py-3.5 rounded-xl font-bold hover:bg-blue-800 transition">إضافة المجموعة</button>
        </div>

        <div id="groupsList" class="space-y-3">
            <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 flex justify-between items-center">
                <span class="font-semibold text-gray-800">مجموعات الصف الأول الثانوي (مجموعة أ)</span>
                <span class="text-xs bg-blue-100 text-blue-800 px-3 py-1 rounded-lg font-bold">نشط</span>
            </div>
        </div>
        <div id="msg" class="mt-4 text-center text-sm font-semibold"></div>
    </div>

    <script>
        function addGroup() {
            const name = document.getElementById('groupName').value.trim();
            const msg = document.getElementById('msg');
            if(!name) {
                msg.textContent = "الرجاء إدخال اسم المجموعة";
                msg.className = "mt-4 text-center text-sm text-red-600 font-bold";
                return;
            }
            msg.textContent = "تمت إضافة المجموعة بنجاح!";
            msg.className = "mt-4 text-center text-sm text-green-600 font-bold bg-green-50 p-3 rounded-xl";
            document.getElementById('groupName').value = '';
        }
    </script>
</body>
</html>
