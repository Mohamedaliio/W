<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classy - بوابة الطالب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center mb-6">
            <div>
                <h1 id="studentName" class="text-xl md:text-2xl font-bold text-indigo-900">أهلاً بك يا بطل</h1>
                <p class="text-gray-500 text-sm">بوابة المتابعة الفردية - Classy</p>
            </div>
            <button onclick="logout()" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-sm font-bold hover:bg-red-100 transition">تسجيل الخروج</button>
        </div>

        <div class="space-y-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div class="flex items-center space-x-4 space-x-reverse">
                    <div class="bg-green-100 p-3 rounded-xl text-green-600 text-xl">✅</div>
                    <div>
                        <h2 class="font-bold text-gray-800">سجل الحضور</h2>
                        <p class="text-gray-500 text-sm">حالة الحضور في الحصص الأخيرة: منتظم</p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div class="flex items-center space-x-4 space-x-reverse">
                    <div class="bg-blue-100 p-3 rounded-xl text-blue-600 text-xl">📈</div>
                    <div>
                        <h2 class="font-bold text-gray-800">درجات الاختبارات</h2>
                        <p class="text-gray-500 text-sm">آخر اختبار: ممتاز</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const name = localStorage.getItem('name') || 'الطالب';
        document.getElementById('studentName').textContent = `أهلاً بك، ${name}`;
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
