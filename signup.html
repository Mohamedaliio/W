<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classy - إنشاء حساب جديد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <h1 class="text-3xl font-bold text-blue-900 text-center mb-2">إنشاء حساب Classy</h1>
        <p class="text-gray-500 text-center mb-6 text-sm">سجل حساب المعلم أو المساعد الأول</p>
        
        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-1">الاسم الكامل</label>
                <input type="text" id="name" required placeholder="أحمد محمد" class="w-full px-4 py-3 border rounded-xl text-right">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="name@example.com" class="w-full px-4 py-3 border rounded-xl text-right">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-1">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 border rounded-xl text-right">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-1">الدور (الصلاحية)</label>
                <select id="role" class="w-full px-4 py-3 border rounded-xl text-right bg-white">
                    <option value="teacher">معلم (أنت)</option>
                    <option value="assistant">مساعد (مثل ميس تسبيح)</option>
                    <option value="student">طالب</option>
                </select>
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-900 text-white py-3.5 rounded-xl font-bold hover:bg-blue-800 transition">إنشاء الحساب</button>
        </form>

        <div id="msg" class="mt-4 text-center text-sm font-semibold"></div>
        
        <div class="mt-6 text-center">
            <a href="index.html" class="text-blue-600 text-sm font-semibold hover:underline">لديك حساب بالفعل؟ سجل دخولك من هنا</a>
        </div>
    </div>

    <script>
        const SIGNUP_API = "https://c-ruby-ten.vercel.app/api/auth/signup";

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const role = document.getElementById('role').value;
            const msg = document.getElementById('msg');
            const btn = document.getElementById('submitBtn');

            msg.textContent = "جاري إنشاء الحساب وحفظه في قاعدة البيانات...";
            msg.className = "mt-4 text-center text-sm text-blue-600 font-semibold";
            btn.disabled = true;

            try {
                const res = await fetch(SIGNUP_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });
                const data = await res.json();

                if (res.ok) {
                    msg.textContent = "تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن.";
                    msg.className = "mt-4 text-center text-sm text-green-600 font-bold bg-green-50 p-3 rounded-xl";
                    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                } else {
                    msg.textContent = data.error || "حدث خطأ أثناء إنشاء الحساب";
                    msg.className = "mt-4 text-center text-sm text-red-600 font-bold bg-red-50 p-3 rounded-xl";
                }
            } catch (err) {
                msg.textContent = "خطأ في الاتصال بالسيرفر";
                msg.className = "mt-4 text-center text-sm text-red-600 font-bold bg-red-50 p-3 rounded-xl";
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
