<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classy - إدارة المصروفات والاشتراكات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-blue-900">متابعة الاشتراكات والمصروفات</h1>
            <a href="dashboard.html" class="text-blue-600 text-sm font-semibold hover:underline">← العودة للوحة التحكم</a>
        </div>

        <div class="space-y-3 mb-6">
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
                <div>
                    <span class="font-semibold text-gray-800 block">أحمد محمد علي</span>
                    <span class="text-xs text-gray-500">الصف الأول الثانوي</span>
                </div>
                <div class="flex items-center space-x-2 space-x-reverse">
                    <button onclick="toggleFee(this)" class="px-4 py-1.5 bg-green-100 text-green-700 rounded-lg text-sm font-bold">تم الدفع</button>
                </div>
            </div>
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
                <div>
                    <span class="font-semibold text-gray-800 block">محمود إبراهيم</span>
                    <span class="text-xs text-gray-500">الصف الأول الثانوي</span>
                </div>
                <div class="flex items-center space-x-2 space-x-reverse">
                    <button onclick="toggleFee(this)" class="px-4 py-1.5 bg-red-100 text-red-700 rounded-lg text-sm font-bold">لم يدفع</button>
                </div>
            </div>
        </div>

        <button onclick="saveFees()" class="w-full bg-blue-900 text-white py-3.5 rounded-xl font-bold hover:bg-blue-800 transition">حفظ التحديثات المالية</button>
        <div id="msg" class="mt-4 text-center text-sm font-semibold"></div>
    </div>

    <script>
        function toggleFee(btn) {
            if (btn.textContent === 'تم الدفع') {
                btn.textContent = 'لم يدفع';
                btn.className = 'px-4 py-1.5 bg-red-100 text-red-700 rounded-lg text-sm font-bold';
            } else {
                btn.textContent = 'تم الدفع';
                btn.className = 'px-4 py-1.5 bg-green-100 text-green-700 rounded-lg text-sm font-bold';
            }
        }
        function saveFees() {
            const msg = document.getElementById('msg');
            msg.textContent = "تم تحديث وحفظ الحالة المالية بنجاح!";
            msg.className = "mt-4 text-center text-sm text-green-600 font-bold bg-green-50 p-3 rounded-xl";
        }
    </script>
</body>
</html>
